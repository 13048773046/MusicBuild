# Codemagic 无签名 IPA 工作流（对齐 .github/workflows/build.yml build-unsigned）
# 产物：MusicApp/build/ipa/MusicApp-unsigned.ipa（可 sideload/自签）
workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (1.1.26)
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || true
      - name: Generate Xcode project
        script: |
          cd MusicApp
          xcodegen generate
      - name: Archive unsigned app
        script: |
          cd MusicApp
          xcodebuild archive \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Release \
            -archivePath build/MusicApp.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        script: |
          cd MusicApp
          APP_PATH=$(find build/MusicApp.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r MusicApp-unsigned.ipa Payload
          ls -la
    artifacts:
      - MusicApp/build/ipa/MusicApp-unsigned.ipa
