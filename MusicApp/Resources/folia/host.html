  <script>
  /* Folia iOS 性能优化：升级旧 localStorage tuning 到新性能默认值
   * （旧版默认 renderQuality:full / textureResolution:1.5 / postProcessTextureCompression:false
   *   会覆盖新默认值，导致优化不生效；此处仅升级性能关键项，保留用户其它自定义） */
  (function () {
    try {
      var KEYS = { lumiere_tuning: { renderQuality: 'balanced' }, sonnet_tuning: { textureResolution: 1 }, tempera_tuning: { textureResolution: 1, postProcessTextureCompression: true } };
      for (var k in KEYS) {
        var raw = localStorage.getItem(k);
        if (!raw) continue;
        var v;
        try { v = JSON.parse(raw); } catch (e) { continue; }
        if (!v || typeof v !== 'object') continue;
        var kv = KEYS[k], changed = false;
        for (var p in kv) {
          if (v[p] !== kv[p]) { v[p] = kv[p]; changed = true; }
        }
        if (changed) localStorage.setItem(k, JSON.stringify(v));
      }
      // 帧率：若用户曾显式选择 off（不限制，120Hz 满载导致卡顿），升级为默认 60
      var fr = localStorage.getItem('visualizer_frame_rate');
      if (fr === 'off') localStorage.setItem('visualizer_frame_rate', '60');
    } catch (e) {}
  })();
  </script>
  <!-- ★ folia-patch.js 必须在本页 ES Module 主包之前同步执行：
       补丁需从页面加载起始就 hook window.__foliaHost（拦截 background/theme 消息）并
       注册 MutationObserver 压制 React 渲染出的根容器黑底。若放在 module 之后（defer），
       ready→pushSong→pushBackground 链路中任何时序错位都会漏掉让位消息。
       ?v=127 版本参数：WKWebView 持久化缓存可能残留旧版 patch（无 body 判空/img 压制/
