name: build-ipa
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup XcodeGen
        run: brew install xcodegen

      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: cd MusicApp && xcodegen generate

      - name: Archive (unsigned)
        run: |
          cd MusicApp
          xcodebuild archive \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Release \
            -archivePath build/MusicApp.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned ipa
        run: |
          cd MusicApp
          APP_PATH=$(find build/MusicApp.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "App: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r MusicApp-unsigned.ipa Payload
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: MusicApp-unsigned-ipa
          path: MusicApp/build/ipa/MusicApp-unsigned.ipa

      - name: Package dSYMs
        if: always()
        run: |
          cd MusicApp
          mkdir -p build/dsym
          DSYM_DIR=build/MusicApp.xcarchive/dSYMs
          ls -la "$DSYM_DIR" 2>/dev/null || echo "(missing)"
          if [ -d "$DSYM_DIR" ] && [ -n "$(ls -A "$DSYM_DIR" 2>/dev/null)" ]; then
            (cd "$DSYM_DIR" && zip -r "$GITHUB_WORKSPACE/MusicApp/build/dsym/MusicApp-dSYMs.zip" .) || true
          fi
          if [ ! -f build/dsym/MusicApp-dSYMs.zip ]; then echo "no dsym" > build/dsym/README.txt; fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MusicApp-dSYMs
          path: MusicApp/build/dsym
          if-no-files-found: warn
