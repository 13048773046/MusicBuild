<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>流萤音乐 · 后台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f10;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100vh}
.login{max-width:360px;margin:15vh auto;background:#1a1a1c;padding:30px;border-radius:16px}
.login h2{margin-bottom:18px;font-size:18px}
.login input{width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a2e;background:#111;color:#fff;margin-bottom:12px;font-size:14px}
.login button{width:100%;padding:12px;border:0;border-radius:10px;background:#2a6df4;color:#fff;font-size:15px;cursor:pointer}
.app{display:flex;min-height:100vh}
.side{width:200px;background:#151517;padding:20px 0;flex-shrink:0}
.side h2{font-size:15px;padding:0 20px 18px;border-bottom:1px solid #262629;margin-bottom:10px}
.side button{display:block;width:100%;text-align:left;padding:11px 20px;background:none;border:0;color:#aaa;font-size:14px;cursor:pointer}
.side button.on{color:#fff;background:#222226;border-left:3px solid #2a6df4}
.main{flex:1;padding:24px 28px;overflow:auto;max-width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.card{background:#1a1a1c;padding:18px;border-radius:12px}
.card .n{font-size:26px;font-weight:600;color:#fff}
.card .l{font-size:12px;color:#888;margin-top:4px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table{width:100%;border-collapse:collapse;background:#1a1a1c;font-size:13px;min-width:560px}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid #262629;white-space:nowrap}
th{color:#888;font-weight:500;background:#1f1f22}
tr:last-child td{border-bottom:0}
td.act button{background:#3a1f1f;color:#e06c5c;border:0;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px}
td.act button.ok{background:#1e3a2a;color:#5cd68a}
td.act button.gray{background:#2a2a2e;color:#ddd}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;background:#2a2a2e;color:#aaa}
.tag.wy{background:#1e3a5f;color:#6fb1ff}
.tag.kw{background:#3a2a1e;color:#ffb36b}
.tag.off{background:#3a1f1f;color:#e06c5c}
.tag.on{background:#1e3a2a;color:#5cd68a}
.thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;background:#222;vertical-align:middle}
.empty{padding:30px;text-align:center;color:#555}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.topbar h1{font-size:18px}
.topbar button{background:#2a2a2e;color:#aaa;border:0;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12px}
.hidden{display:none}
.modal.hidden{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:99;padding:18px}
.modal-box{background:#1a1a1c;border-radius:14px;width:100%;max-width:420px;max-height:84vh;overflow:auto;display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #262629;font-size:15px;font-weight:600;flex-shrink:0}
.modal-h button{background:none;border:0;color:#888;font-size:20px;cursor:pointer;padding:0 6px}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;gap:10px;padding:14px 16px;border-top:1px solid #262629;flex-shrink:0}
.modal-f .mbtn{flex:1;padding:11px;border:0;border-radius:10px;background:#2a2a2e;color:#eee;font-size:14px;cursor:pointer}
.modal-f .m-save{background:#2a6df4;color:#fff}
.frow{margin-bottom:12px}
.frow label{display:block;font-size:12px;color:#888;margin-bottom:5px}
.frow input,.frow select,.frow textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;outline:none}
.frow textarea{resize:none}
.avrow{display:flex;align-items:center;gap:10px}
.avrow img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#222;flex-shrink:0}
.avrow button{padding:8px 12px;border:0;border-radius:8px;background:#2a2a2e;color:#ddd;font-size:13px;cursor:pointer}
.hint{font-size:11px;color:#666;margin-top:4px}
@media (max-width:768px){
  .app{flex-direction:column}
  .side{width:100%;padding:0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid #262629}
  .side h2{display:none}
  .side button{display:inline-block;width:auto;padding:13px 16px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
  .side button.on{border-left:0;border-bottom:3px solid #2a6df4;background:transparent}
  .main{padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:14px}
  .card .n{font-size:22px}
  .topbar{margin-bottom:14px}
  .topbar h1{font-size:16px}
  table{font-size:12px;min-width:520px}
  th,td{padding:10px 12px}
  .login{margin:8vh 16px;padding:24px}
}
</style></head><body>
<div id="loginBox" class="login">
<h2>流萤音乐后台</h2>
<input id="pwd" type="password" placeholder="管理密码">
<button onclick="login()">登录</button>
</div>
<div id="appBox" class="app hidden">
<div class="side">
<h2>流萤音乐</h2>
<button data-t="dash" class="on" onclick="tab('dash')">仪表盘</button>
<button data-t="users" onclick="tab('users')">用户管理</button>
<button data-t="tracks" onclick="tab('tracks')">上传歌曲</button>
<button data-t="collected" onclick="tab('collected')">采集歌曲</button>
<button data-t="comments" onclick="tab('comments')">评论管理</button>
<button data-t="ann" onclick="tab('ann')">公告管理</button>

</div>
<div class="main">
<div class="topbar"><h1 id="title">仪表盘</h1><div><button style="margin-right:8px" onclick="changePwd()">修改密码</button><button onclick="logout()">退出</button></div></div>
<div id="content"></div>
</div>
</div>
<div id="modal" class="modal hidden">
<div class="modal-box">
<div class="modal-h"><span id="mTitle">编辑</span><button onclick="closeModal()">×</button></div>
<div id="mBody" class="modal-b"></div>
<div class="modal-f"><button class="mbtn" onclick="closeModal()">取消</button><button class="mbtn m-save" id="mSaveBtn" onclick="mSave()">保存</button></div>
</div>
</div>
<script>
let token=localStorage.getItem('admin_token')||'';
function h(){return token}
function esc(s){return String(s==null?'':s).replace(/[&<>"'\\]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','\\':'&#92;'}[c])).replace(/\r?\n/g,'&#10;')}
function fmtTime(ts){if(!ts)return '-';const d=new Date(ts*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDur(s){if(!s)return '-';s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
async function api(path, opts){
  opts=opts||{};opts.headers=Object.assign({'X-Admin-Token':h()},opts.headers||{});
  const r=await fetch('/music/api/admin'+path,opts);
  if(r.status===401){showLogin();throw new Error('未授权，请重新登录')}
  let d=null;try{d=await r.json()}catch(e){throw new Error('HTTP '+r.status)}
  if(!r.ok||(d&&d.err))throw new Error((d&&d.err)||('HTTP '+r.status));
  return d;
}
function showLogin(){token='';localStorage.removeItem('admin_token');document.getElementById('loginBox').classList.remove('hidden');document.getElementById('appBox').classList.add('hidden');}
async function login(){
  const pwd=document.getElementById('pwd').value.trim();
  if(!pwd){alert('请输入管理密码');return}
  token=pwd;
  try{await api('/auth-check')}
  catch(e){showLogin();alert('密码错误，请重试');return}
  localStorage.setItem('admin_token',token);
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  alert('登录成功');
  loadDash();
}
function logout(){showLogin()}
function tab(t){
  document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const titles={dash:'仪表盘',users:'用户管理',tracks:'上传歌曲',collected:'采集歌曲',comments:'评论管理',ann:'公告管理',notify:'官方通知',members:'会员管理',verify:'认证管理',site:'网站管理',rec:'推荐设置'};
  document.getElementById('title').textContent=titles[t];
  if(t==='dash')loadDash();if(t==='users')loadUsers();if(t==='tracks')loadTracks();if(t==='collected')loadCollected();if(t==='comments')loadComments();if(t==='ann')loadAnn();if(t==='notify')loadNotify();if(t==='members')loadMembers();if(t==='verify')loadVerify();if(t==='site')loadSite();if(t==='rec')loadRecCfg();
}
let curPage={tracks:1,collected:1,comments:1};
let curTracks=[],curCols=[];
async function loadDash(){
  const d=await api('/stats');
  document.getElementById('content').innerHTML=
    '<div class="cards">'+
    '<div class="card"><div class="n">'+d.users+'</div><div class="l">用户总数</div></div>'+
    '<div class="card"><div class="n">'+d.tracks+'</div><div class="l">用户上传歌曲</div></div>'+
    '<div class="card"><div class="n">'+d.collected+'</div><div class="l">采集歌曲</div></div>'+
    '<div class="card"><div class="n">'+d.plays+'</div><div class="l">累计播放次数</div></div>'+
    '</div>';
}
// 网站管理：官网展示配置 + AI 接口配置（key/base/model）+ AI 评论人形象 + AI 主动评论控制
async function loadSite(){
  const [c,a,s,p,sad]=await Promise.all([
    (await fetch('/music/api/site-config')).json(),
    api('/ai-config'),
    api('/ai-comment'),
    api('/ai-profile'),
    api('/splash-ads')
  ]);
  window._splashAds=(sad&&sad.list)||[];
  const fld=(id,label,val,ph)=>(
    '<div style="margin-bottom:14px"><label style="display:block;font-size:13px;color:#888;margin-bottom:6px">'+label+'</label>'+
    '<input id="'+id+'" value="'+esc(val||'')+'" placeholder="'+ph+'" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;box-sizing:border-box"></div>');
  const keyPh=a.hasKey?('已配置（'+esc(a.keyMasked)+'），留空保持不变'):'填写 AI 接口 Key（必填）';
  let h='<div style="max-width:780px">';
  // 区块一：官网展示配置
  window._banners=(c.banners||[]).map(b=>({name:b.name,title:b.title||'',link:b.link||''}));
  h+='<div style="background:#1a1a1c;padding:24px;border-radius:12px;margin-bottom:16px">'+
  '<h3 style="margin-bottom:6px;font-size:16px">官网展示配置</h3>'+
  '<p style="font-size:12px;color:#888;margin-bottom:18px">修改后即时生效到官网首页（歌曲总数为数据库实时统计，无需填写）。</p>'+
  fld('siteName','网站名称',c.site_name,'流萤音乐')+
  fld('heroSub','首页副标题',c.hero_subtitle,'一句话 slogan')+
  fld('iosUrl','iOS 下载链接',c.ios_url,'https://...ipa 或 TestFlight 地址')+
  fld('androidUrl','Android 下载链接',c.android_url,'https://...apk')+
  '<div style="margin-top:20px;padding:14px;border:1px solid #262629;border-radius:10px">'+
  '<h4 style="margin-bottom:10px;font-size:14px">关于页联系方式（App 内「关于」页展示，前端不再硬编码）</h4>'+
  fld('aboutWebsite','官网链接',c.about_website||'','https://...')+
  fld('aboutEmail','联系邮箱',c.about_email||'','name@example.com')+
  fld('aboutPhone','联系电话',c.about_phone||'','手机号/QQ号')+
  fld('aboutQqGroup','官方 QQ 群',c.about_qq_group||'','群号')+
  '</div>'+
  '<div style="margin-bottom:14px"><label style="display:block;font-size:13px;color:#888;margin-bottom:6px">官网轮播图（数量不限，可增删排序）</label>'+
  '<div id="bannerList" style="margin-bottom:10px"></div>'+
  '<label style="font-size:13px;color:#888;cursor:pointer;padding:8px 12px;border:1px solid #2a2a2e;border-radius:8px;display:inline-block">＋ 上传轮播图<input id="bannerFile" type="file" accept="image/*" style="display:none" onchange="uploadBanner(this.files[0])"></label>'+
  '<span id="bannerTip" style="margin-left:10px;font-size:12px;color:#888"></span></div>'+
  '<div style="margin-top:20px;padding:14px;border:1px solid #262629;border-radius:10px">'+
  '<h4 style="margin-bottom:10px;font-size:14px">App 启动页广告（每次启动随机展示一张，非轮播）</h4>'+
  '<p style="font-size:12px;color:#888;margin-bottom:12px">可上传多张，App 每次启动随机抽 1 张展示（5 秒后可跳过）。建议竖版图片（9:16），上传后立即生效。</p>'+
  '<div id="splashList" style="margin-bottom:10px"></div>'+
  '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+
  '<input id="splashLink" type="text" placeholder="跳转链接（可选，如 https://example.com，填了广告才可点击跳转）" '+
  'style="flex:1;min-width:0;background:#111;border:1px solid #2a2a2e;border-radius:8px;color:#eee;font-size:13px;padding:8px 10px;outline:none">'+
  '</div>'+
  '<label style="font-size:13px;color:#888;cursor:pointer;padding:8px 12px;border:1px solid #2a2a2e;border-radius:8px;display:inline-block">＋ 上传广告图<input id="splashFile" type="file" accept="image/*" style="display:none" onchange="uploadSplash(this.files[0])"></label>'+
  '<span id="splashTip" style="margin-left:10px;font-size:12px;color:#888"></span></div>'+
  '<div style="margin-top:20px;padding:14px;border:1px solid #262629;border-radius:10px">'+
  '<h4 style="margin-bottom:10px;font-size:14px">易支付（App 内开通会员）</h4>'+
  '<p style="font-size:12px;color:#888;margin-bottom:12px">在易支付商户后台获取商户ID与密钥。填写后 App 内开通会员即可拉起易支付收银台；支付成功自动开通会员并在官方消息通知用户。回调地址会自动使用本站点 /api/pay/notify，一般无需填写。</p>'+
  '<div style="margin-bottom:14px"><label style="display:flex;align-items:center;gap:10px;cursor:pointer">'+
  '<input type="checkbox" id="payEnabled" '+(c.pay_enabled?'checked':'')+' style="width:18px;height:18px;accent-color:#4CD9A5">'+
  '<div style="font-size:14px;color:#fff">启用易支付</div></label></div>'+
  fld('payMerchantId','商户ID（pid）',c.pay_merchant_id,'易支付商户后台的商户ID')+
  fld('payMerchantKey','商户密钥（key）',c.pay_merchant_key,'易支付商户后台的密钥')+
  fld('payGateway','支付网关地址',c.pay_gateway,'如 https://pay.xxx.com（会自动拼 /submit.php）')+
  fld('payNotifyUrl','异步回调地址（可选）',c.pay_notify_url,'留空自动使用 当前站点/api/pay/notify')+
  fld('payReturnUrl','同步跳转地址（可选）',c.pay_return_url,'留空自动使用 当前站点/api/pay/return')+
  '<div style="margin-top:12px;padding:10px;background:#0f1215;border-radius:8px;border:1px solid #262629">'+
  '<div style="font-size:12px;color:#9c9ca0;margin-bottom:8px">会员套餐价格与时长（App 开通页展示与下单金额以此为准）</div>'+
  fld('vipMonthPrice','VIP 月卡（元）',c.vip_month_price,'默认 6 元 / 30 天')+
  fld('vipMonthDays','VIP 月卡（天）',c.vip_month_days,'')+
  fld('vipQuarterPrice','VIP 季卡（元）',c.vip_quarter_price,'默认 16 元 / 90 天')+
  fld('vipQuarterDays','VIP 季卡（天）',c.vip_quarter_days,'')+
  fld('vipYearPrice','VIP 年卡（元）',c.vip_year_price,'默认 48 元 / 365 天')+
  fld('vipYearDays','VIP 年卡（天）',c.vip_year_days,'')+
  fld('svipMonthPrice','SVIP 月卡（元）',c.svip_month_price,'默认 10 元 / 30 天')+
  fld('svipMonthDays','SVIP 月卡（天）',c.svip_month_days,'')+
  fld('svipQuarterPrice','SVIP 季卡（元）',c.svip_quarter_price,'默认 26 元 / 90 天')+
  fld('svipQuarterDays','SVIP 季卡（天）',c.svip_quarter_days,'')+
  fld('svipYearPrice','SVIP 年卡（元）',c.svip_year_price,'默认 68 元 / 365 天')+
  fld('svipYearDays','SVIP 年卡（天）',c.svip_year_days,'')+
  '</div>'+
  '</div>'+
  '<div style="margin-bottom:14px;padding:12px;background:#111;border-radius:8px;border:1px solid #2a2a2e">'+
  '<label style="display:flex;align-items:center;gap:10px;cursor:pointer">'+
  '<input type="checkbox" id="jpushEnabled" '+(c.jpush_enabled?'checked':'')+' style="width:18px;height:18px;accent-color:#4CD9A5">'+
  '<div><div style="font-size:14px;color:#fff">极光离线推送</div>'+
  '<div style="font-size:12px;color:#888;margin-top:2px">开启后，APP 被杀时收到点赞/评论/关注的系统通知（仅安卓）</div></div>'+
  '</label></div>'+
  '<button class="mbtn m-save" onclick="saveSite()">保存</button>'+
  '<span id="siteTip" style="margin-left:12px;font-size:13px"></span>'+
  '</div>';
  // 区块二：AI 接口配置
  h+='<div style="background:#1a1a1c;padding:24px;border-radius:12px;margin-bottom:16px">'+
  '<h3 style="margin-bottom:6px;font-size:16px">AI 接口配置</h3>'+
  '<p style="font-size:12px;color:#888;margin-bottom:18px">AI 乐评接入（OpenAI 兼容接口）。Key 仅首次填写或更换时输入，留空保持不变；保存后即时生效，无需重启。</p>'+
  fld('aiBase','接口地址（Base URL）',a.base,'https://.../v1')+
  fld('aiModel','模型',a.model,'qwen-turbo')+
  fld('aiKey','接口 Key','',keyPh)+
  '<button class="mbtn m-save" onclick="saveAiKey()">保存</button>'+
  '<span id="aiKeyTip" style="margin-left:12px;font-size:13px"></span>'+
  '</div>';
  // 区块三：AI 评论人形象
  // 头像 URL 带文件名作版本号（?t=）：换头像后文件名变化 → URL 变化 → 浏览器缓存自动失效
  const avUrl=p.avatar?(location.origin+'/music/api/avatar/ai_liuying_comment?t='+encodeURIComponent(p.avatar)):'';
  const bgUrl=p.background?(location.origin+'/music/api/background/ai_liuying_comment?t='+encodeURIComponent(p.background)):'';
  h+='<div style="background:#1a1a1c;padding:24px;border-radius:12px;margin-bottom:16px">'+
  '<h3 style="margin-bottom:6px;font-size:16px">AI 评论人形象</h3>'+
  '<p style="font-size:12px;color:#888;margin-bottom:18px">设置 AI 评论显示的名称、头像、签名与主页背景图，保存后新评论与通知即时使用。</p>'+
  '<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'+
  (avUrl?'<img src="'+avUrl+'" style="width:64px;height:64px;border-radius:50%;object-fit:cover;background:#222" onerror="this.style.visibility=\'hidden\'">':'<div style="width:64px;height:64px;border-radius:50%;background:#2a2a2e;display:flex;align-items:center;justify-content:center;color:#888;font-size:22px">'+esc((p.name||'AI')[0])+'</div>')+
  '<label style="font-size:13px;color:#888;cursor:pointer;padding:8px 12px;border:1px solid #2a2a2e;border-radius:8px">上传头像<input id="aiAvatar" type="file" accept="image/*" style="display:none" onchange="document.getElementById(\'aiAvatarName\').textContent=this.files[0]?this.files[0].name:\'\'"></label>'+

async function saveSplashLink(id){
  const inp=document.getElementById('slink_'+id);
  if(!inp)return;
  const link=(inp.value||'').trim();
  try{
    const fd=new FormData();fd.append('link',link);
    await api('/splash-ads/'+id,{method:'POST',body:fd});
    const b=window._splashAds.find(x=>x.id===id);
    if(b)b.link=link;
    renderSplashAds();
  }catch(e){alert('保存失败：'+e.message);}
}
async function uploadSplash(file){
  const tip=document.getElementById('splashTip');
  if(!file){return;}
  if(!/image\/(png|jpe?g|webp|heic)$/i.test(file.type)){tip.textContent='仅支持 png/jpg/webp/heic';return;}
  const fd=new FormData();fd.append('image',file);
  const linkEl=document.getElementById('splashLink');
  if(linkEl&&linkEl.value.trim())fd.append('link',linkEl.value.trim());
  try{
    const r=await api('/splash-ads',{method:'POST',body:fd});
    if(r&&r.name){
      const link=(linkEl?linkEl.value.trim():'');
      (window._splashAds=window._splashAds||[]).push({id:r.id,name:r.name,title:'',link:link,active:1});
      renderSplashAds();
      tip.textContent='已上传 ✓（下次启动随机展示）';tip.style.color='#4CD9A5';
      document.getElementById('splashFile').value='';
      if(linkEl)linkEl.value='';
    }else{tip.textContent='上传失败';}
  }catch(e){tip.textContent='上传失败：'+e.message;}
}
async function delSplash(id){
  if(!confirm('删除这张启动页广告？'))return;
  try{
    await api('/splash-ads/'+id,{method:'DELETE'});
    window._splashAds=(window._splashAds||[]).filter(b=>b.id!==id);
    renderSplashAds();
  }catch(e){alert('删除失败：'+e.message);}
}

    '</div>'+
    '<button class="mbtn" style="padding:5px 8px;font-size:12px" onclick="mvBanner('+i+',-1)">↑</button>'+
    '<button class="mbtn" style="padding:5px 8px;font-size:12px" onclick="mvBanner('+i+',1)">↓</button>'+
    '<button class="mbtn" style="padding:5px 8px;font-size:12px;color:#ff6b6b" onclick="delBanner('+i+')">删</button>'+
    '</div>').join('');
  el.querySelectorAll('input[data-b]').forEach(inp=>{
    inp.addEventListener('input',()=>{const b=window._banners[+inp.dataset.b];if(b)b[inp.dataset.k]=inp.value;});
  });

function mvBanner(i,d){
  const bs=window._banners;const j=i+d;
  if(!bs||j<0||j>=bs.length)return;
  const t=bs[i];bs[i]=bs[j];bs[j]=t;renderBanners();saveSite();
}
function delBanner(i){
  const bs=window._banners;if(!bs)return;
  bs.splice(i,1);renderBanners();saveSite();
}

function onAnnTypeChange(){
  const t=document.getElementById('annType').value;

async function uploadPackage(platform){
  const input=document.createElement('input');
  input.type='file';
  input.accept=platform==='ios'?'.ipa':'.apk';
  input.onchange=async ()=>{
    const f=input.files[0];
    if(!f)return;
    if(f.size>100*1024*1024){alert('安装包不能超过 100MB');return;}
    const fd=new FormData();
    fd.append('platform',platform);
    fd.append('file',f);
    try{
      const r=await fetch('/music/api/admin/upload-package',{method:'POST',headers:{'X-Admin-Token':token},body:fd});
      const d=await r.json();
      if(r.ok&&d.url){
        document.getElementById(platform==='ios'?'annUrlIos':'annUrlAndroid').value=location.origin+d.url;
        alert('上传成功');
      }else{alert(d.err||'上传失败');}
    }catch(e){alert('网络错误');}
  };
  input.click();
}
async function submitAnn(){
  const title=document.getElementById('annTitle').value.trim();
  const content=document.getElementById('annContent').value.trim();
  const version=document.getElementById('annVersion').value.trim();
  const type=document.getElementById('annType').value;
  const showOnce=document.getElementById('annShowOnce').checked?1:0;
  const forceUpdate=document.getElementById('annForceUpdate').checked?1:0;
  const downloadUrlIos=document.getElementById('annUrlIos').value.trim();
  const downloadUrlAndroid=document.getElementById('annUrlAndroid').value.trim();
  const versionIos=(document.getElementById('annVersionIos')||{value:''}).value.trim();
  const versionAndroid=(document.getElementById('annVersionAndroid')||{value:''}).value.trim();
  if(!title||!content){alert('请填写标题和内容');return;}
  if(type==='update'&&!downloadUrlIos&&!downloadUrlAndroid){alert('更新通知需要填写至少一个平台的安装包或链接');return;}
  try{
    const r=await fetch('/music/api/admin/announcement',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token},body:JSON.stringify({title,content,version,versionIos,versionAndroid,type,showOnce,forceUpdate,downloadUrl:downloadUrlIos,downloadUrlIos,downloadUrlAndroid})});
    if(r.ok){alert('发布成功');loadAnn();}
    else{alert('发布失败');}
  }catch(e){alert('网络错误');}
}

  });
  h+='</table></div>';
  h+='<div class="modal hidden" id="notifyModal"><div class="modal-box" style="max-width:500px;width:100%"><h3 style="margin-bottom:16px">发布官方通知</h3><textarea id="notifyContent" placeholder="输入通知内容..." style="width:100%;height:120px;padding:12px;border-radius:10px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;box-sizing:border-box;resize:vertical"></textarea><div style="margin-top:12px"><label style="display:block;font-size:13px;color:#888;margin-bottom:6px">发送范围（留空=全广播给所有用户；填用户ID=仅发送给该用户）</label><input id="notifyReceiver" placeholder="用户ID（留空为全广播）" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;box-sizing:border-box"></div><div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end"><button onclick="hideNotifyModal()" style="padding:9px 18px;border:0;border-radius:8px;background:#2a2a2e;color:#aaa;cursor:pointer">取消</button><button onclick="publishNotify()" style="padding:9px 18px;border:0;border-radius:8px;background:#2a6df4;color:#fff;cursor:pointer">发布</button></div></div></div>';
  document.getElementById('content').innerHTML=h;
}
function showNotifyModal(){document.getElementById('notifyModal').classList.remove('hidden')}
function hideNotifyModal(){document.getElementById('notifyModal').classList.add('hidden')}
async function publishNotify(){
  const content=document.getElementById('notifyContent').value.trim();
  if(!content){alert('请输入通知内容');return}
  const receiver=(document.getElementById('notifyReceiver').value||'').trim();
  const r=await api('/official-message',{method:'POST',body:JSON.stringify({content:content,receiverUserId:receiver})});
  if(r.ok){hideNotifyModal();loadNotify();}else{alert(r.err||'发布失败')}
}
async function delNotify(id){
  if(!confirm('确定删除这条通知？'))return;
  const r=await api('/official-message/'+id,{method:'DELETE'});
  if(r.ok)loadNotify();else alert(r.err||'删除失败')
}


// ---- 会员管理（开通/延期 VIP、SVIP；会员开通后自动发官方定向通知） ----
async function loadMembers(){
  const d=await api('/users');
  let h='<div class="topbar"><h1>会员管理</h1></div>';
  h+='<p style="font-size:12px;color:#888;margin-bottom:12px">搜索后为指定用户开通/延期 VIP（绿色）或 SVIP（金色）。SVIP 覆盖 VIP（只显示 SVIP 图标、按 SVIP 校验特权）。</p>';
  h+='<div style="margin-bottom:14px;display:flex;gap:8px"><input id="memberQ" placeholder="搜索昵称 / 账号 / 用户ID" style="flex:1;min-width:0;background:#111;border:1px solid #2a2a2e;border-radius:8px;color:#eee;font-size:13px;padding:8px 12px;outline:none" oninput="filterMembers()"><button onclick="filterMembers()" style="padding:8px 14px;border:0;border-radius:8px;background:#2a6df4;color:#fff;cursor:pointer">搜索</button></div>';
  h+='<div class="tablewrap"><table><tr><th>用户</th><th>当前会员</th><th>到期时间</th><th>操作</th></tr><tbody id="memberRows">';
  (d.list||[]).forEach(u=>{
    const memBadge=u.member==='svip'?'<span style="background:linear-gradient(135deg,#8a6d1f,#d4af37);color:#fff;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700">SVIP</span>'
      :u.member==='vip'?'<span style="background:linear-gradient(135deg,#1f6a4a,#2ecc8f);color:#fff;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:700">VIP</span>'
      :'<span style="color:#666;font-size:12px">未开通</span>';
    const exp=(u.svipExpire||0)>(u.memberExpire||0)?u.svipExpire:u.memberExpire;
    const expTxt=exp>0?new Date(exp*1000).toLocaleString():'-';
    h+='<tr data-k="'+esc((u.name||'')+' '+(u.account||'')+' '+(u.id||'').toLowerCase())+'"><td><div style="color:#fff">'+esc(u.name||'')+'</div><div style="font-size:11px;color:#888">'+esc(u.account||'')+' · '+esc(u.id||'')+'</div></td>'
      +'<td>'+memBadge+'</td><td style="font-size:12px;color:#aaa">'+expTxt+'</td>'
      +'<td class="act"><button onclick="openMember(\''+u.id+'\',\''+esc(u.name||'')+'\')">开通/延期</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="modal hidden" id="memberModal"><div class="modal-box" style="max-width:480px;width:100%"><h3 style="margin-bottom:16px">会员开通 / 延期</h3><div id="memberModalUser" style="font-size:13px;color:#888;margin-bottom:12px"></div>'
    +'<div style="display:flex;gap:8px;margin-bottom:12px"><button id="mpVip" onclick="pickPlan(\'vip\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#2ecc8f;font-weight:700;cursor:pointer">VIP（绿）</button>'
    +'<button id="mpSvip" onclick="pickPlan(\'svip\')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#d4af37;font-weight:700;cursor:pointer">SVIP（金）</button></div>'
    +'<label style="display:block;font-size:13px;color:#888;margin-bottom:6px">开通天数（在剩余时长上叠加）</label>'
    +'<input id="memberDays" type="number" value="30" min="1" max="3650" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;box-sizing:border-box">'
    +'<div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end"><button onclick="hideMember()" style="padding:9px 18px;border:0;border-radius:8px;background:#2a2a2e;color:#aaa;cursor:pointer">取消</button>'
    +'<button onclick="saveMember()" style="padding:9px 18px;border:0;border-radius:8px;background:#4CD9A5;color:#111;font-weight:700;cursor:pointer">确认开通</button></div></div></div>';
  document.getElementById('content').innerHTML=h;
}
function filterMembers(){
  const q=(document.getElementById('memberQ').value||'').toLowerCase().trim();
  document.querySelectorAll('#memberRows tr').forEach(tr=>{tr.style.display=(!q||(tr.dataset.k||'').includes(q))?'':'none'});
}
let _memUser=null,_memPlan='vip';
function openMember(uid,name){_memUser=uid;document.getElementById('memberModalUser').textContent='用户：'+name+'（'+uid+'）';pickPlan('vip');document.getElementById('memberModal').classList.remove('hidden')}
function hideMember(){document.getElementById('memberModal').classList.add('hidden')}
function pickPlan(p){
  _memPlan=p;
  const v=document.getElementById('mpVip'),s=document.getElementById('mpSvip');
  v.style.borderColor=(p==='vip'?'#2ecc8f':'#2a2a2e');v.style.background=(p==='vip'?'#12271d':'#111');
  s.style.borderColor=(p==='svip'?'#d4af37':'#2a2a2e');s.style.background=(p==='svip'?'#2a2410':'#111');
}
async function saveMember(){
  if(!_memUser)return;
  const days=parseInt(document.getElementById('memberDays').value)||30;
  const r=await api('/member',{method:'POST',body:JSON.stringify({userId:_memUser,plan:_memPlan,days:days})});
  if(r.ok){hideMember();loadMembers();}else alert(r.err||'开通失败');
}

// ---- 认证管理（类别两级 + 申请审核；审核通过后自动蓝 V + 官方通知） ----
async function loadVerify(){
  const [cats,apps]=await Promise.all([api('/verify-categories'),api('/verify-applications?status=pending')]);
  let h='<div class="topbar"><h1>认证管理</h1></div>';
  // 认证类别管理
  h+='<div style="background:#1a1a1c;padding:20px;border-radius:12px;margin-bottom:16px"><h3 style="margin-bottom:6px;font-size:16px">认证类别</h3>'
    +'<p style="font-size:12px;color:#888;margin-bottom:12px">两级分类：第一级（个人/企业/组织）+ 第二级（如 歌手/工作室/品牌）。前端申请认证时按此选择。</p>';
  h+='<div id="vcatList" style="margin-bottom:10px">';
  (cats.list||[]).forEach(c=>{h+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #222"><span style="font-size:13px;color:#fff">'+esc(c.level1)+'</span><span style="font-size:12px;color:#888">› '+esc(c.level2||'不限')+'</span><span style="flex:1"></span><button onclick="delVcat(\''+c.id+'\')" style="font-size:12px;color:#ff6b6b;background:none;border:0;cursor:pointer">删除</button></div>'});
  h+='</div>';
  h+='<div style="display:flex;gap:8px"><input id="vcatL1" placeholder="第一级（如 个人/企业/组织）" style="flex:1;min-width:0;background:#111;border:1px solid #2a2a2e;border-radius:8px;color:#eee;font-size:13px;padding:8px 10px;outline:none">'
    +'<input id="vcatL2" placeholder="第二级（如 歌手/工作室，可空）" style="flex:1;min-width:0;background:#111;border:1px solid #2a2a2e;border-radius:8px;color:#eee;font-size:13px;padding:8px 10px;outline:none">'
    +'<button onclick="addVcat()" style="padding:8px 14px;border:0;border-radius:8px;background:#2a6df4;color:#fff;cursor:pointer">添加</button></div></div>';
  // 申请列表 + 状态筛选
  h+='<div style="display:flex;gap:8px;margin-bottom:12px">'
    +'<button onclick="loadVerifyBy(\'pending\')" style="padding:6px 14px;border:1px solid #2a2a2e;border-radius:8px;background:#111;color:#ffcc4d;cursor:pointer;font-size:13px">待审核</button>'
    +'<button onclick="loadVerifyBy(\'approved\')" style="padding:6px 14px;border:1px solid #2a2a2e;border-radius:8px;background:#111;color:#2ecc8f;cursor:pointer;font-size:13px">已通过</button>'
    +'<button onclick="loadVerifyBy(\'rejected\')" style="padding:6px 14px;border:1px solid #2a2a2e;border-radius:8px;background:#111;color:#ff6b6b;cursor:pointer;font-size:13px">已拒绝</button></div>';
  h+='<div class="tablewrap"><table><tr><th>申请用户</th><th>类别</th><th>认证标签</th><th>申请理由</th><th>审核意见</th><th>时间</th><th>操作</th></tr><tbody id="vappRows">';
  (apps.list||[]).forEach(a=>{
    h+='<tr><td><div style="color:#fff">'+esc(a.userName||'')+'</div><div style="font-size:11px;color:#888">'+esc(a.account||'')+' · '+esc(a.userId||'')+'</div></td>'
      +'<td style="font-size:13px">'+esc(a.level1||'')+(a.level2?' › '+esc(a.level2):'')+'</td>'
      +'<td style="font-size:13px;color:#aaa">'+esc(a.label||'-')+'</td>'
      +'<td style="max-width:220px;white-space:normal;font-size:13px;color:#ccc">'+esc(a.reason||'')+'</td>'
      +'<td style="max-width:180px;white-space:normal;font-size:12px;color:'+(a.reviewNote?'#ffcc4d':'#555')+'">'+esc(a.reviewNote||'-')+'</td>'
      +'<td style="font-size:12px;color:#888">'+new Date((a.created||0)*1000).toLocaleString()+'</td>'
      +'<td class="act"><button onclick="reviewApp(\''+a.id+'\',\'approve\')" style="color:#2ecc8f">通过</button> <button onclick="reviewApp(\''+a.id+'\',\'reject\')" style="color:#ff6b6b">拒绝</button></td></tr>';
  });
  if(!(apps.list||[]).length)h+='<tr><td colspan="7" class="empty">暂无申请</td></tr>';
  h+='</tbody></table></div>';
  document.getElementById('content').innerHTML=h;
}
async function loadVerifyBy(status){await loadVerify();}
async function addVcat(){
  const level1=(document.getElementById('vcatL1').value||'').trim(),level2=(document.getElementById('vcatL2').value||'').trim();
  if(!level1){alert('请填写第一级类别');return}
  const r=await api('/verify-category',{method:'POST',body:JSON.stringify({level1:level1,level2:level2})});
  if(r.ok){loadVerify();}else alert(r.err||'添加失败');
}
async function delVcat(id){
  if(!confirm('删除该认证类别？'))return;
  const r=await api('/verify-category/delete',{method:'POST',body:JSON.stringify({id:id})});
  if(r.ok){loadVerify();}else alert(r.err||'删除失败');
}
async function reviewApp(id,action){
  let note='';
  if(action==='reject'){
    note=(prompt('请输入拒绝原因（必填，将通知申请用户）：')||'').trim();
    if(!note){alert('拒绝时必须填写原因');return}
  }else{
    note=(prompt('审核意见（选填，将随通过通知发送；留空则只发恭喜文案）：')||'').trim();
  }
  const r=await api('/verify-application',{method:'POST',body:JSON.stringify({id:id,action:action,note:note})});
  if(r.ok){loadVerify();}else alert(r.err||'操作失败');
}


// ---- 推荐设置（后台动态调整推荐算法参数，recommend.py 5s 缓存生效） ----
async function loadRecCfg(){
  const d=await api('/recommend-config');
  const defs=d.defaults||{},saved=d.saved||{};
  const num=(id,label,key,step,min,max,unit)=>(
    '<div style="margin-bottom:14px"><label style="display:block;font-size:13px;color:#888;margin-bottom:6px">'+label+'（默认 '+defs[key]+unit+'）</label>'+
    '<input id="'+id+'" type="number" step="'+step+'" min="'+min+'" max="'+max+'" value="'+esc(saved[key]||defs[key])+'" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a2a2e;background:#111;color:#fff;font-size:14px;box-sizing:border-box"></div>');
  let h='<div style="max-width:780px">';
  h+='<div style="background:#1a1a1c;padding:24px;border-radius:12px;margin-bottom:16px">'+
     '<h3 style="margin-bottom:6px;font-size:16px">推荐算法参数</h3>'+
     '<p style="font-size:12px;color:#888;margin-bottom:18px">修改后约 5 秒内生效（无需重启）。权重越大该路占比越高；探索池越大候选越多但计算变重。留空/清空该字段恢复默认值。</p>';
  h+='<div style="background:#111;border-radius:10px;padding:16px;margin-bottom:16px"><h4 style="margin-bottom:12px;font-size:14px">各路召回权重</h4>';
  h+=num('recWBehavior','行为匹配权重（近期爱听）','rec_w_behavior','0.1',0,50,'');
  h+=num('recWGenre','风格吻合权重','rec_w_genre','0.1',0,50,'');
  h+=num('recWArtist','常听歌手权重','rec_w_artist','0.1',0,50,'');
  h+=num('recWScene','应景场景权重','rec_w_scene','0.1',0,50,'');
  h+=num('recWHot','热度权重','rec_w_hot','0.1',0,50,'');
  h+=num('recWFresh','新歌权重','rec_w_fresh','0.1',0,50,'');
  h+=num('recWExplore','探索权重（换口味）','rec_w_explore','0.1',0,50,'');
  h+='</div>';
  h+='<div style="background:#111;border-radius:10px;padding:16px;margin-bottom:16px"><h4 style="margin-bottom:12px;font-size:14px">算法细节</h4>';
  h+=num('recExplorePool','探索池大小','rec_explore_pool','20',20,2000,'');
  h+=num('recSceneBoost','场景加权倍数（应景歌/近期爱听前移强度）','rec_scene_boost','0.1',0,5,'');
  h+=num('recNoise','随机扰动（越大结果越不同）','rec_noise','0.1',0,10,'');
  h+=num('recMaxArtist','单歌手上限（同一歌手最多出现）','rec_max_per_artist','1',1,10,'首');
  h+='</div>';
  h+='<button class="mbtn m-save" style="width:100%;padding:12px;border:0;border-radius:10px;background:#2a6df4;color:#fff;font-size:15px;cursor:pointer" onclick="saveRecCfg()">保存推荐参数</button>';
  h+='<span id="recTip" style="margin-left:10px;font-size:12px;color:#888"></span></div></div>';
  document.getElementById('content').innerHTML=h;
}
async function saveRecCfg(){
  const keys={recWBehavior:'rec_w_behavior',recWGenre:'rec_w_genre',recWArtist:'rec_w_artist',recWScene:'rec_w_scene',
    recWHot:'rec_w_hot',recWFresh:'rec_w_fresh',recWExplore:'rec_w_explore',recExplorePool:'rec_explore_pool',
    recSceneBoost:'rec_scene_boost',recNoise:'rec_noise',recMaxArtist:'rec_max_per_artist'};
  const body={};
  for(const id in keys){
    const v=document.getElementById(id).value;
    if(v==='')continue;  // 空=恢复默认
    const n=parseFloat(v);
    if(!isNaN(n)&&n>=0)body[keys[id]]=n;
  }
  await api('/recommend-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const tip=document.getElementById('recTip');
  tip.textContent='已保存 ✓（约 5 秒生效）';tip.style.color='#4CD9A5';
  setTimeout(()=>{tip.textContent=''},3000);
}
</script></body></html>
